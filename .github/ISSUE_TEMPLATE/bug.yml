name: 🐞 Reporte de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir...\n2. Tocar..."
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Teléfono y versión de Android
      placeholder: "Ej. Samsung A12, Android 12"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o notas adicionales
